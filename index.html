<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0614">
<title>Gift Shooter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#07040d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff;touch-action:none}
body{background:radial-gradient(circle at 50% 30%,#2a0f3d 0%,#07040d 70%)}
img{-webkit-user-drag:none;pointer-events:none}
#stage{position:fixed;top:0;left:0;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(ellipse 70% 40% at 50% 0%,rgba(254,44,85,.35),transparent 70%),
   radial-gradient(ellipse 60% 40% at 50% 100%,rgba(37,244,238,.22),transparent 70%),
   linear-gradient(180deg,#16072a 0%,#0c0518 55%,#0a0a1e 100%)}
.scr{position:absolute;inset:0;display:none}
.scr.show{display:block}
/* spotlights */
.spot{position:absolute;top:-40px;width:180px;height:120%;opacity:.18;filter:blur(6px);transform-origin:50% 0;pointer-events:none}
.spot.a{left:5%;background:linear-gradient(180deg,#25f4ee,transparent 75%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);animation:sw 3.2s ease-in-out infinite alternate}
.spot.b{right:5%;background:linear-gradient(180deg,#fe2c55,transparent 75%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);animation:sw 2.7s ease-in-out infinite alternate-reverse}
@keyframes sw{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
/* bulbs */
.bulbs{position:absolute;left:0;right:0;display:flex;justify-content:space-around;padding:0 6px;pointer-events:none}
.bulbs i{width:9px;height:9px;border-radius:50%;background:#ffd34d;box-shadow:0 0 8px #ffd34d,0 0 16px #ff9d00;animation:bl .6s steps(1) infinite}
.bulbs i:nth-child(2n){animation-delay:.3s}
@keyframes bl{0%{opacity:1}50%{opacity:.25}}
/* START */
#start .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.float-g{position:absolute;width:86px;animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(6deg)}}
.logo{position:relative;text-align:center;z-index:2}
.logo .t1{font-size:58px;font-weight:900;letter-spacing:1px;line-height:.9;font-style:italic;
  background:linear-gradient(180deg,#fff 0%,#ffe27a 45%,#ff9d00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 3px 0 #fe2c55) drop-shadow(-3px -2px 0 #25f4ee) drop-shadow(0 8px 20px rgba(0,0,0,.6))}
.logo .t2{margin-top:10px;font-size:15px;font-weight:700;letter-spacing:4px;color:#25f4ee;text-shadow:0 0 12px #25f4ee}
.bigcoin{width:150px;margin:18px auto 6px;display:block;animation:spin 2.4s ease-in-out infinite;filter:drop-shadow(0 0 25px rgba(255,190,40,.7))}
@keyframes spin{0%,100%{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(1.06)}}
.rules{font-size:15px;color:#e7dcff;text-align:center;line-height:1.45;margin:6px 0 22px;z-index:2}
.rules b{color:#ffd34d}
.btn{position:relative;z-index:2;border:none;outline:none;cursor:pointer;font-weight:900;font-size:24px;letter-spacing:2px;color:#fff;
  padding:18px 0;width:270px;border-radius:40px;background:linear-gradient(90deg,#fe2c55,#ff6a3d);
  box-shadow:0 6px 0 #a1112f,0 0 30px rgba(254,44,85,.6);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a1112f,0 0 30px rgba(254,44,85,.6)}
.btn.pulse{animation:pu 1s ease-in-out infinite}
@keyframes pu{0%,100%{scale:1}50%{scale:1.07}}
.btn.dis{filter:grayscale(.8) brightness(.7);animation:none}
/* GAME */
#hud{position:absolute;left:0;right:0;top:0;height:118px;z-index:20;pointer-events:none}
#tbar{position:absolute;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top));height:14px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
#tfill{height:100%;width:100%;border-radius:8px;background:linear-gradient(90deg,#25f4ee,#7c5cff,#fe2c55)}
#tnum{position:absolute;left:16px;top:calc(38px + env(safe-area-inset-top));font-size:40px;font-weight:900;font-style:italic;text-shadow:0 0 14px rgba(37,244,238,.8)}
#tnum.hot{color:#ff3b5c;text-shadow:0 0 16px #ff3b5c;animation:hb .5s ease-in-out infinite}
@keyframes hb{50%{transform:scale(1.15)}}
#score{position:absolute;right:14px;top:calc(40px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px;padding:6px 16px 6px 6px;border-radius:30px;
  background:rgba(0,0,0,.45);border:2px solid rgba(255,211,77,.6);box-shadow:0 0 18px rgba(255,190,40,.35)}
#score img{width:40px;height:40px}
#scoreN{font-size:28px;font-weight:900;color:#ffd34d;min-width:70px;text-align:right}
#score.bump{animation:bump .25s ease-out}
@keyframes bump{40%{transform:scale(1.18)}}
#combo{position:absolute;left:50%;top:calc(88px + env(safe-area-inset-top));transform:translateX(-50%);font-size:26px;font-weight:900;font-style:italic;color:#fff;opacity:0;
  text-shadow:2px 2px 0 #fe2c55,-2px -1px 0 #25f4ee;white-space:nowrap}
.rail{position:absolute;left:-10px;right:-10px;height:12px;border-radius:6px;
  background:linear-gradient(180deg,#ffcf5a,#c27a00);box-shadow:0 0 14px rgba(255,190,40,.6),0 6px 12px rgba(0,0,0,.6)}
.rail::after{content:"";position:absolute;left:0;right:0;top:12px;height:26px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 22px,transparent 22px 44px);opacity:.8}
#field{position:absolute;inset:0;z-index:10}
.g{position:absolute;left:0;top:0;will-change:transform}
.g img{width:100%;height:100%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.g.bonus::before{content:"";position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,rgba(255,220,90,.75),rgba(255,140,0,.25) 55%,transparent 70%);animation:gl .5s ease-in-out infinite alternate}
.g.bonus .x2{position:absolute;right:-6px;top:-6px;background:#fe2c55;color:#fff;font-weight:900;font-size:16px;padding:3px 8px;border-radius:12px;box-shadow:0 0 12px #fe2c55;font-style:italic}
@keyframes gl{from{opacity:.6;transform:scale(.9)}to{opacity:1;transform:scale(1.1)}}
#fx{position:absolute;inset:0;z-index:15;pointer-events:none}
.fx{position:absolute;left:0;top:0;will-change:transform,opacity}
.plus{font-weight:900;font-size:30px;color:#ffd34d;font-style:italic;white-space:nowrap;text-shadow:2px 2px 0 #b3410a,0 0 14px rgba(255,190,40,.8)}
.ring{width:120px;height:120px;border-radius:50%;border:6px solid #fff;box-shadow:0 0 20px #25f4ee,inset 0 0 20px #fe2c55}
.spark{width:10px;height:10px;border-radius:50%}
.cross{width:70px;height:70px;border:3px solid #fe2c55;border-radius:50%;box-shadow:0 0 10px #fe2c55}
.cross::before,.cross::after{content:"";position:absolute;background:#fe2c55;left:50%;top:-12px;bottom:-12px;width:3px;margin-left:-1.5px}
.cross::after{top:50%;left:-12px;right:-12px;bottom:auto;height:3px;width:auto;margin:-1.5px 0 0}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:25;pointer-events:none}
#cd{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none}
#cd span{font-size:150px;font-weight:900;font-style:italic;color:#fff;text-shadow:5px 5px 0 #fe2c55,-5px -3px 0 #25f4ee,0 0 40px rgba(255,255,255,.5)}
#cd span.go{animation:cdz .55s ease-out forwards}
@keyframes cdz{0%{transform:scale(2.4);opacity:0}30%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.8);opacity:0}}
#tu{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(10,4,20,.55)}
#tu span{font-size:64px;font-weight:900;font-style:italic;color:#ffd34d;text-shadow:4px 4px 0 #fe2c55,-3px -2px 0 #25f4ee;animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:scale(3) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
/* WIN */
#win{background:radial-gradient(circle at 50% 35%,rgba(255,190,40,.35),transparent 55%)}
#win .wrap,#load .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px}
.rays{position:absolute;left:50%;top:32%;width:700px;height:700px;margin:-350px 0 0 -350px;opacity:.35;
  background:repeating-conic-gradient(rgba(255,211,77,.55) 0 10deg,transparent 10deg 20deg);border-radius:50%;
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%);animation:rot 14s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.yw{font-size:60px;font-weight:900;font-style:italic;line-height:1;background:linear-gradient(180deg,#fff,#ffe27a 50%,#ff9d00);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 3px 0 #fe2c55) drop-shadow(-2px -2px 0 #25f4ee);z-index:2}
.wcoin{width:130px;margin:10px 0 0;z-index:2;animation:spin 2.4s ease-in-out infinite;filter:drop-shadow(0 0 25px rgba(255,190,40,.8))}
.wamt{font-size:46px;font-weight:900;color:#ffd34d;text-shadow:0 0 20px rgba(255,190,40,.7),2px 3px 0 #a14a00;z-index:2}
.wsub{font-size:14px;color:#cfc3ea;margin:2px 0 20px;letter-spacing:1px;z-index:2;text-transform:uppercase;font-weight:700}
.card{z-index:2;width:330px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.card label{display:block;font-size:14px;font-weight:700;margin-bottom:10px;color:#fff;text-align:center}
.inrow{display:flex;align-items:center;background:#fff;border-radius:14px;padding:4px 4px 4px 14px;height:54px}
.inrow .at{color:#888;font-size:20px;font-weight:700;margin-right:2px}
#nick{flex:1;min-width:0;border:none;outline:none;font-size:19px;font-weight:600;color:#161823;background:transparent;user-select:text;-webkit-user-select:text}
#paste{border:none;cursor:pointer;height:46px;padding:0 16px;border-radius:11px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(90deg,#25c8e4,#7c5cff);display:flex;align-items:center;gap:6px}
#paste:active{transform:scale(.95)}
#send{margin-top:16px;width:100%;font-size:19px;padding:16px 0}
/* LOAD */
.lav{width:110px;height:110px;border-radius:50%;position:relative;margin-bottom:26px}
.lav::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:5px solid transparent;border-top-color:#25f4ee;border-right-color:#fe2c55;animation:rot .8s linear infinite}
.av{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;color:#fff;text-transform:uppercase}
.lnick{font-size:22px;font-weight:800;margin-bottom:6px}
#lstep{font-size:15px;color:#cfc3ea;height:22px;margin-bottom:18px}
.pbar{width:280px;height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
#pfill{height:100%;width:0;background:linear-gradient(90deg,#25f4ee,#fe2c55);border-radius:6px}
.checks{margin-top:22px;width:280px}
.checks div{font-size:14px;color:#8f86a8;padding:5px 0;display:flex;align-items:center;gap:10px;transition:color .2s}
.checks div i{width:20px;height:20px;border-radius:50%;border:2px solid #5d5478;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:900}
.checks div.ok{color:#fff}
.checks div.ok i{background:#20d5a0;border-color:#20d5a0}
/* ACCOUNT */
#acc{background:#fff;color:#161823}
.topb{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;margin-top:env(safe-area-inset-top);border-bottom:1px solid #eee}
.topb .ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.topb .ttl{font-size:17px;font-weight:700}
.prof{display:flex;flex-direction:column;align-items:center;padding:18px 0 10px}
.prof .av{width:96px;height:96px;font-size:40px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.prof .nm{font-size:18px;font-weight:700;margin-top:10px}
.stats{display:flex;gap:28px;margin-top:12px}
.stats div{text-align:center}
.stats b{display:block;font-size:17px}
.stats span{font-size:13px;color:#8a8b91}
.bal{margin:14px 16px 0;border-radius:18px;padding:18px;background:linear-gradient(135deg,#fff7e0,#ffe6b0);border:1px solid #ffd97a;position:relative;overflow:hidden;cursor:pointer}
.bal .lbl{font-size:14px;color:#8a6a1a;font-weight:600}
.bal .row{display:flex;align-items:center;gap:8px;margin-top:6px}
.bal .row img{width:44px;height:44px}
#balN{font-size:38px;font-weight:800;color:#161823}
.bal.pop .row img{animation:bump .3s ease-out}
.toast{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;background:#161823;color:#fff;padding:11px 18px;border-radius:24px;font-size:15px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:all .35s cubic-bezier(.2,1.4,.4,1);z-index:5}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast i{width:20px;height:20px;border-radius:50%;background:#20d5a0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}
.sec{margin:20px 16px 6px;font-size:15px;font-weight:700}
.tx{display:flex;align-items:center;padding:12px 16px;gap:12px;border-bottom:1px solid #f1f1f2}
.tx .ti{width:40px;height:40px;border-radius:12px;background:#fff3d6;display:flex;align-items:center;justify-content:center}
.tx .ti img{width:30px;height:30px}
.tx .tt{flex:1}
.tx .tt b{display:block;font-size:15px;font-weight:600}
.tx .tt span{font-size:12px;color:#8a8b91}
.tx .ta{font-weight:700;font-size:16px;color:#16a34a}
.tx.new{animation:txin .5s ease-out}
@keyframes txin{from{background:#fff3d6;transform:translateX(30px);opacity:0}to{background:#fff;transform:none;opacity:1}}
.crn{position:absolute;width:28px;pointer-events:none}
</style>
</head>
<body>
<div id="stage">

 <!-- GAME -->
 <div id="game" class="scr show">
  <div class="spot a"></div><div class="spot b"></div>
  <div id="rails"></div>
  <div id="field"></div>
  <div id="fx"></div>
  <div id="hud">
   <div id="tbar"><div id="tfill"></div></div>
   <div id="tnum">6.0</div>
   <div id="score"><img id="hCoin" alt=""><span id="scoreN">0</span></div>
   <div id="combo"></div>
  </div>
  <div id="flash"></div>
  <div id="cd"></div>
  <div id="tu"><span>TIME'S UP!</span></div>
 </div>

 <!-- WIN -->
 <div id="win" class="scr">
  <div class="rays"></div>
  <div id="confetti"></div>
  <div class="wrap">
   <div class="yw">YOU WIN!</div>
   <img class="wcoin" id="wCoin" alt="">
   <div class="wamt" id="wAmt">0</div>
   <div class="wsub">coins collected</div>
   <div class="card">
    <label>Enter your nickname to get the coins</label>
    <div class="inrow"><span class="at">@</span><input id="nick" type="text" placeholder="nickname" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="24"><button id="paste">
     <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>Paste</button></div>
    <button class="btn dis" id="send">SEND COINS</button>
   </div>
  </div>
 </div>

 <!-- LOADING -->
 <div id="load" class="scr">
  <div class="spot a"></div><div class="spot b"></div>
  <div class="wrap">
   <div class="lav"><div class="av" id="lAv"></div></div>
   <div class="lnick" id="lNick">@user</div>
   <div id="lstep">Searching account...</div>
   <div class="pbar"><div id="pfill"></div></div>
   <div class="checks">
    <div id="c1"><i>✓</i>Account found</div>
    <div id="c2"><i>✓</i>Connection secured</div>
    <div id="c3"><i>✓</i>Coins sent</div>
   </div>
  </div>
 </div>

 <!-- ACCOUNT -->
 <div id="acc" class="scr">
  <div class="topb">
   <div class="ic" id="back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#161823" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
   <div class="ttl" id="aTop">@user</div>
   <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="#161823"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div>
  </div>
  <div class="toast" id="toast"><i>✓</i><span id="toastT">+0 coins received</span></div>
  <div class="prof">
   <div class="av" id="aAv"></div>
   <div class="nm" id="aNm">@user</div>
   <div class="stats"><div><b id="st1">0</b><span>Following</span></div><div><b id="st2">0</b><span>Followers</span></div><div><b id="st3">0</b><span>Likes</span></div></div>
  </div>
  <div class="bal" id="bal">
   <div class="lbl">Coins balance</div>
   <div class="row"><img id="aCoin" alt=""><span id="balN">0</span></div>
  </div>
  <div class="sec">Recent activity</div>
  <div id="txs"></div>
 </div>

const $=id=>document.getElementById(id);
const stage=$('stage');
let S=1,W=400,H=760;
function fit(){
  const vv=window.visualViewport;
  const vw=vv?vv.width:innerWidth, vh=vv?vv.height:innerHeight;
  S=Math.min(vw/400,vh/760);
  W=Math.min(vw/S,560); H=vh/S;
  stage.style.width=W+'px'; stage.style.height=H+'px';
  stage.style.left=((vw-W*S)/2)+'px';
  stage.style.transform='scale('+S+')';
  layoutRails();
}
addEventListener('resize',fit);
if(window.visualViewport) visualViewport.addEventListener('resize',fit);

// fullscreen on Android first touch
if(/Android/i.test(navigator.userAgent)){
  const fs=()=>{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);removeEventListener('pointerdown',fs,true)};
  addEventListener('pointerdown',fs,true);
}

['hCoin','wCoin','aCoin'].forEach(id=>$(id).src=I.coin);
document.querySelectorAll('.bulbs').forEach(b=>{for(let i=0;i<16;i++)b.appendChild(document.createElement('i'))});

const GIFTS=[
 {k:'rose',v:15,s:.72},{k:'lion',v:320,s:1},{k:'lionroar',v:450,s:1},{k:'eagle',v:380,s:1},
 {k:'phoenix',v:600,s:1.05},{k:'pegasus',v:520,s:1.02},{k:'dragon',v:850,s:1.08},{k:'yeti',v:410,s:1},{k:'zeus',v:1000,s:1.05}
];
const BIG=['dragon','zeus','phoenix','pegasus','lionroar'];

function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('show',s.id===id))}

/* ================= GAME ================= */
const DUR=6;
let ended=false,rails=[],gifts=[],fxs=[],score=0,shown=0,running=false,tLeft=DUR,last=0,combo=0,lastHit=-9,spawnT=[],bonusT=0,nowT=0,shake=0;
function layoutRails(){
  const top=150, bot=H-60, span=bot-top;
  rails=[0,1,2].map(i=>({y:top+span*(0.27+i*0.33),dir:i%2?-1:1,speed:150+i*25}));
  const rc=$('rails'); rc.innerHTML='';
  rails.forEach(r=>{const d=document.createElement('div');d.className='rail';d.style.top=r.y+'px';rc.appendChild(d)});
}
function pick(){
  // more big gifts, fewer roses
  const r=Math.random();
  if(r<.18) return GIFTS[0];
  return GIFTS[1+Math.floor(Math.random()*(GIFTS.length-1))];
}
function mkGift(def,x,y,size,bonus){
  const el=document.createElement('div');el.className='g'+(bonus?' bonus':'');
  el.style.width=el.style.height=size+'px';
  const im=document.createElement('img');im.src=I[def.k];el.appendChild(im);
  if(bonus){const t=document.createElement('div');t.className='x2';t.textContent='x2';el.appendChild(t)}
  $('field').appendChild(el);
  const g={el,def,x,y,size,bonus,born:nowT,alive:true,wob:Math.random()*6.28};
  gifts.push(g);return g;
}
function spawnRail(i,x){
  const r=rails[i],d=pick(),size=96*d.s;
  const g=mkGift(d,x!==undefined?x:(r.dir>0?-size:W),r.y-size+8,size,false);
  g.rail=i;g.vx=r.dir*r.speed*(0.9+Math.random()*.3);
}
function spawnBonus(){
  const k=BIG[Math.floor(Math.random()*BIG.length)],d=GIFTS.find(g=>g.k===k);
  const size=140,dir=Math.random()<.5?1:-1;
  const y=170+Math.random()*(H-330-size);
  const g=mkGift(d,dir>0?-size:W,y,size,true);
  g.vx=dir*(230+Math.random()*90);g.fly=true;g.baseY=y;g.amp=40+Math.random()*50;
}
function resetGame(){
  $('field').innerHTML='';$('fx').innerHTML='';gifts=[];fxs=[];score=0;shown=0;combo=0;lastHit=-9;tLeft=DUR;nowT=0;bonusT=.6;shake=0;
  $('scoreN').textContent='0';$('tnum').textContent='6.0';$('tnum').classList.remove('hot');$('tfill').style.width='100%';
  $('tu').style.display='none';$('combo').style.opacity=0;ended=false;running=false;
  layoutRails();
  rails.forEach((r,i)=>{ // prefill rails
    for(let x=20+i*40;x<W;x+=140+Math.random()*40) spawnRail(i,x);
  });
  spawnT=rails.map(()=>.5+Math.random()*.4);
}
function countdown(cb){
  const cd=$('cd');const seq=['3','2','1','GO!'];let i=0;
  (function nx(){
    if(i>=seq.length){cd.innerHTML='';cb();return}
    cd.innerHTML='<span class="go">'+seq[i]+'</span>';i++;setTimeout(nx,i===4?420:520);
  })();
}
function addFx(el,o){$('fx').appendChild(el);o.el=el;o.t=0;fxs.push(o);return o}
function burst(x,y,big){
  // ring
  const r=document.createElement('div');r.className='fx ring';
  addFx(r,{type:'ring',x:x-60,y:y-60,life:.4});
  const cols=['#ffd34d','#25f4ee','#fe2c55','#fff','#ff9d00'];
  const n=big?22:14;
  for(let i=0;i<n;i++){
    const s=document.createElement('div');s.className='fx spark';const c=cols[i%cols.length];
    s.style.background=c;s.style.boxShadow='0 0 10px '+c;
    const a=Math.random()*6.28,sp=200+Math.random()*(big?420:300);
    addFx(s,{type:'p',x:x-5,y:y-5,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,life:.5+Math.random()*.3});
  }
}
function flyCoins(x,y,n,val){
  const sc=$('score').getBoundingClientRect(),st=stage.getBoundingClientRect();
  const tx=(sc.left-st.left)/S+12, ty=(sc.top-st.top)/S+6;
  const per=Math.round(val/n);
  for(let i=0;i<n;i++){
    const c=document.createElement('img');c.className='fx';c.src=I.coin;c.style.width='34px';
    const a=Math.random()*6.28;
    addFx(c,{type:'coin',sx:x-17+Math.cos(a)*30,sy:y-17+Math.sin(a)*30,tx,ty,life:.55+i*.05,delay:i*.03,
      cx:x+(Math.random()-.5)*220,cy:y-120-Math.random()*120,val:i===n-1?val-per*(n-1):per});
  }
}
function plusTxt(x,y,txt,big){
  const p=document.createElement('div');p.className='fx plus';p.textContent=txt;if(big)p.style.fontSize='40px';
  addFx(p,{type:'txt',x:x-40,y:y-30,life:.8});
}
function hitAt(px,py){
  if(ended)return;
  if(!running){running=true;}
  // crosshair
  const c=document.createElement('div');c.className='fx cross';addFx(c,{type:'cross',x:px-35,y:py-35,life:.3});
  let best=null,bd=1e9;
  gifts.forEach(g=>{if(!g.alive)return;const cx=g.x+g.size/2,cy=g.y+g.size/2;const d=Math.hypot(px-cx,py-cy);
    if(d<g.size*.62&&d<bd){bd=d;best=g}});
  if(!best)return;
  best.alive=false;best.dieT=0;
  if(nowT-lastHit<.85)combo++;else combo=1;lastHit=nowT;
  const mult=(best.bonus?2:1)*(combo>=8?3:combo>=4?2:1);
  const val=best.def.v*mult;
  const cx=best.x+best.size/2,cy=best.y+best.size/2;
  burst(cx,cy,best.bonus);
  flyCoins(cx,cy,best.bonus?8:Math.min(6,2+Math.floor(best.def.v/200)),val);
  plusTxt(cx,cy,'+'+val.toLocaleString('en-US'),best.bonus||mult>1);
  score+=val;
  if(best.bonus){shake=.35;$('flash').style.opacity=.55}
  if(combo>=3){const cb=$('combo');cb.textContent=(combo>=8?'MEGA ':combo>=4?'SUPER ':'')+'COMBO x'+combo;cb.style.opacity=1;cb.dataset.t=nowT;
    cb.style.transform='translateX(-50%) scale(1.35)';}
}
$('game').addEventListener('pointerdown',e=>{
  const st=stage.getBoundingClientRect();
  hitAt((e.clientX-st.left)/S,(e.clientY-st.top)/S);
});

function endGame(){
  running=false;ended=true;
  openWin();
}

function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(!ended){
    nowT+=dt;
    if(running){tLeft-=dt;
    if(tLeft<=0){tLeft=0;endGame()}
    $('tnum').textContent=tLeft.toFixed(1);
    $('tfill').style.width=(tLeft/DUR*100)+'%';
    if(tLeft<3)$('tnum').classList.add('hot');}
    // spawns
    spawnT.forEach((s,i)=>{spawnT[i]-=dt;if(spawnT[i]<=0){spawnRail(i);spawnT[i]=.55+Math.random()*.45}});
    bonusT-=dt;if(bonusT<=0){spawnBonus();bonusT=1.1+Math.random()*.6}
  }
  // gifts
  gifts=gifts.filter(g=>{
    if(g.alive){
      if(!ended){
        g.x+=g.vx*dt;if(g.x<-g.size-40||g.x>W+40){g.el.remove();return false}
        if(g.fly)g.y=g.baseY+Math.sin(nowT*4+g.wob)*g.amp;
      }
      const age=nowT-g.born;
      let sc=1,rot=Math.sin(nowT*6+g.wob)*6,dy=g.vx?-Math.abs(Math.sin(nowT*8+g.wob))*6:0;
      if(g.fly){sc=1+Math.sin(nowT*10)*.05;rot=g.vx>0?12:-12;rot+=Math.sin(nowT*7)*8}
      g.el.style.transform=`translate(${g.x}px,${g.y+dy}px) rotate(${rot}deg) scale(${sc})`;
      return true;
    }else{
      g.dieT+=dt;const k=g.dieT/.25;
      if(k>=1){g.el.remove();return false}
      const sc=g.fade?1-k:1+k*.7;
      g.el.style.opacity=1-k;
      g.el.style.transform=`translate(${g.x}px,${g.y}px) scale(${sc}) rotate(${k*25}deg)`;
      if(!g.fade)g.el.style.filter=`brightness(${1+k*2})`;
      return true;
    }
  });
  // fx
  fxs=fxs.filter(f=>{
    f.t+=dt;const k=f.t/f.life;
    if(f.type==='coin'){
      const tt=Math.max(0,f.t-f.delay)/(f.life-f.delay);
      if(tt>=1){f.el.remove();shown+=f.val;$('scoreN').textContent=Math.min(shown,score).toLocaleString('en-US');
        const s=$('score');s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump');return false}
      const e=tt*tt,u=1-e;
      const x=u*u*f.sx+2*u*e*f.cx+e*e*f.tx, y=u*u*f.sy+2*u*e*f.cy+e*e*f.ty;
      f.el.style.transform=`translate(${x}px,${y}px) scale(${1.2-tt*.4}) rotate(${tt*360}deg)`;return true;
    }
    if(k>=1){f.el.remove();return false}
    if(f.type==='p'){f.vy+=600*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.el.style.transform=`translate(${f.x}px,${f.y}px) scale(${1-k})`;}
    else if(f.type==='ring'){f.el.style.transform=`translate(${f.x}px,${f.y}px) scale(${.3+k*1.2})`;f.el.style.opacity=1-k}
    else if(f.type==='txt'){f.el.style.transform=`translate(${f.x}px,${f.y-k*70}px) scale(${k<.15?k/.15*1.3:1.3-(k-.15)*.4})`;f.el.style.opacity=k>.7?(1-k)/.3:1}
    else if(f.type==='cross'){f.el.style.transform=`translate(${f.x}px,${f.y}px) scale(${1.3-k*.5})`;f.el.style.opacity=1-k}
    return true;
  });
  // combo fade
  const cb=$('combo');if(cb.style.opacity==1){const a=nowT-(+cb.dataset.t);cb.style.transform=`translateX(-50%) scale(${Math.max(1,1.35-a*2)})`;if(a>.9)cb.style.opacity=0}
  // flash / shake
  const fl=$('flash');if(+fl.style.opacity>0)fl.style.opacity=Math.max(0,+fl.style.opacity-dt*3);
  if(shake>0){shake-=dt;const m=shake*30;$('field').style.transform=`translate(${(Math.random()-.5)*m}px,${(Math.random()-.5)*m}px)`;if(shake<=0)$('field').style.transform=''}
  requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{last=t;loop(t)});

/* ================= WIN ================= */
let won=0;
function countUp(el,from,to,dur,cb){
  const t0=performance.now();
  (function st(){const k=Math.min(1,(performance.now()-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=Math.round(from+(to-from)*e).toLocaleString('en-US');if(k<1)requestAnimationFrame(st);else cb&&cb()})();
}
function confetti(box,n){
  box.innerHTML='';
  const cols=['#ffd34d','#25f4ee','#fe2c55','#7c5cff','#fff'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div');const s=6+Math.random()*8;
    c.style.cssText=`position:absolute;left:${Math.random()*100}%;top:-20px;width:${s}px;height:${s*1.6}px;background:${cols[i%5]};border-radius:2px;opacity:.95;`+
     `animation:cf ${2.2+Math.random()*2}s linear ${-Math.random()*3}s infinite`;
    box.appendChild(c);
  }
}
const cfs=document.createElement('style');cfs.textContent='@keyframes cf{to{transform:translateY(1100px) rotate(720deg) translateX(40px)}}';document.head.appendChild(cfs);
function openWin(){
  won=Math.max(score,1);
  show('win');confetti($('confetti'),50);
  $('nick').value='';updSend();
  $('wAmt').textContent=won.toLocaleString('en-US');
}
function genNick(){
  const a=['luna','kira','maks','nova','sasha','dark','sunny','milo','zoe','alex','vlad','mia','toxic','lil','real','its','neo','pixel','frosty','ghost'];
  const b=['vibes','star','fox','queen','king','gamer','wolf','baby','x','official','life','cat','pro','storm'];
  const sep=['.','_','','_'];
  let n=a[Math.floor(Math.random()*a.length)]+sep[Math.floor(Math.random()*4)]+b[Math.floor(Math.random()*b.length)];
  if(Math.random()<.75)n+=Math.floor(Math.random()*999);
  return n;
}
$('paste').addEventListener('click',()=>{
  const n=genNick();const inp=$('nick');inp.value='';let i=0;
  (function ty(){inp.value=n.slice(0,++i);updSend();if(i<n.length)setTimeout(ty,28)})();
});
function updSend(){const ok=$('nick').value.trim().length>0;const s=$('send');s.classList.toggle('dis',!ok);s.classList.toggle('pulse',ok)}
$('nick').addEventListener('input',updSend);
$('nick').addEventListener('pointerdown',e=>e.stopPropagation());
$('send').addEventListener('click',()=>{
  const n=$('nick').value.trim().replace(/^@+/,'');if(!n)return;
  $('nick').blur();startLoad(n);
});

/* ================= LOADING ================= */
const AVG=[['#fe2c55','#ff9d00'],['#25f4ee','#7c5cff'],['#7c5cff','#fe2c55'],['#20d5a0','#25c8e4'],['#ff9d00','#ffd34d']];
let nickName='',avBg='';
function startLoad(n){
  nickName=n;const g=AVG[Math.floor(Math.random()*AVG.length)];avBg=`linear-gradient(135deg,${g[0]},${g[1]})`;
  show('load');
  $('lAv').style.background=avBg;$('lAv').textContent=n[0];$('lNick').textContent='@'+n;
  ['c1','c2','c3'].forEach(c=>$(c).classList.remove('ok'));
  const steps=[[0,'Searching @'+n+'...',''],[350,'Account found','c1'],[650,'Sending '+won.toLocaleString('en-US')+' coins...','c2'],[1000,'Done!','c3']];
  steps.forEach(s=>setTimeout(()=>{$('lstep').textContent=s[1];if(s[2])$(s[2]).classList.add('ok')},s[0]));
  const t0=performance.now(),D=1150;
  (function pr(){const k=Math.min(1,(performance.now()-t0)/D);$('pfill').style.width=(k*100)+'%';if(k<1)requestAnimationFrame(pr);else setTimeout(openAcc,120)})();
}

/* ================= ACCOUNT ================= */
function fmtK(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)}
function openAcc(){
  show('acc');
  $('aTop').textContent='@'+nickName;$('aNm').textContent='@'+nickName;
  $('aAv').style.background=avBg;$('aAv').textContent=nickName[0];
  $('st1').textContent=40+Math.floor(Math.random()*400);
  $('st2').textContent=fmtK(300+Math.floor(Math.random()*25000));
  $('st3').textContent=fmtK(2000+Math.floor(Math.random()*400000));
  const old=Math.floor(Math.random()*90)+5;
  $('balN').textContent=old;
  $('txs').innerHTML=
   `<div class="tx"><div class="ti"><img src="${I.coin}"></div><div class="tt"><b>Daily check-in</b><span>Yesterday</span></div><div class="ta">+5</div></div>`+
   `<div class="tx"><div class="ti"><img src="${I.rose}"></div><div class="tt"><b>Gift received</b><span>3 days ago</span></div><div class="ta">+1</div></div>`;
  $('toast').classList.remove('on');
  setTimeout(()=>{
    $('toastT').textContent='+'+won.toLocaleString('en-US')+' coins received';$('toast').classList.add('on');
    const tx=document.createElement('div');tx.className='tx new';
    tx.innerHTML=`<div class="ti"><img src="${I.coin}"></div><div class="tt"><b>Gift Shooter reward</b><span>Just now</span></div><div class="ta">+${won.toLocaleString('en-US')}</div>`;
    $('txs').prepend(tx);
    coinRain();
    let p=0;const pi=setInterval(()=>{$('bal').classList.remove('pop');void $('bal').offsetWidth;$('bal').classList.add('pop');if(++p>8)clearInterval(pi)},260);
    countUp($('balN'),old,old+won,2300);
    setTimeout(()=>$('toast').classList.remove('on'),3200);
  },500);
}
function coinRain(){
  const b=$('bal');
  for(let i=0;i<14;i++){
    const c=document.createElement('img');c.className='crn';c.src=I.coin;
    const x=10+Math.random()*280;c.style.left=x+'px';c.style.top='-30px';b.appendChild(c);
    c.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(${120+Math.random()*30}px) rotate(${360+Math.random()*360}deg)`,opacity:0}],
      {duration:900+Math.random()*700,delay:i*90,easing:'cubic-bezier(.4,0,.8,.6)',fill:'forwards'}).onfinish=()=>c.remove();
  }
}
function resetAll(){show('game');resetGame()}
$('back').addEventListener('click',resetAll);
$('bal').addEventListener('click',resetAll);

fit();resetGame();
</script>
